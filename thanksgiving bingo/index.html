<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thanksgiving Break Bingo</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f7f2ea;
    text-align:center;
    margin:20px;
}

h1{
    color:#8B4513;
}

#board{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
    max-width:900px;
    margin:auto;
}

.cell{
    background:white;
    border:2px solid #d97b29;
    border-radius:10px;
    min-height:100px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px;
    cursor:pointer;
    font-size:14px;
    font-weight:bold;
    transition:.2s;
}

.cell:hover{
    transform:scale(1.03);
}

.marked{
    background:#ffcc80;
    color:#5c2f00;
}

.free{
    background:#ffd54f;
}

button{
    margin:20px;
    padding:12px 20px;
    border:none;
    border-radius:8px;
    background:#8B4513;
    color:white;
    font-size:16px;
    cursor:pointer;
}

#message{
    font-size:28px;
    font-weight:bold;
    color:#e65100;
    margin:20px;
}

.confetti{
    position:fixed;
    width:10px;
    height:10px;
    pointer-events:none;
    animation:fall 3s linear forwards;
}

@keyframes fall{
    from{
        transform:translateY(-100px) rotate(0deg);
    }
    to{
        transform:translateY(100vh) rotate(720deg);
    }
}
</style>
</head>

<body>

<h1>🦃 Thanksgiving Break Bingo 🦃</h1>

<p>Click squares as teammates share stories. Get 5 in a row!</p>

<button onclick="newGame()">New Game</button>

<div id="message"></div>

<div id="board"></div>

<script>

const prompts = [
"Traveled more than 100 miles",
"Hosted family or friends",
"Cooked a Thanksgiving dish",
"Tried a new recipe",
"Ate pumpkin pie",
"Watched football",
"Played board games",
"Took a long nap",
"Started holiday decorating",
"Went shopping",
"Read a book",
"Binged a TV show",
"Spent time outdoors",
"Saw fall colors",
"Visited a new place",
"Attended a family tradition",
"Had travel delays",
"Took a family photo",
"Spent time with pets",
"Watched a movie",
"Had leftovers for days",
"Learned something new",
"Met up with old friends",
"Had a funny family moment",
"Worked during the break",
"Went on a hike",
"Cooked with someone",
"Slept in later than usual",
"Avoided cooking entirely",
"Already planning December",
"Had unexpected guests",
"Made a favorite family recipe",
"Spent time unplugged",
"Got caught in holiday traffic",
"Discovered a new favorite food"
];

let boardData = [];

function shuffle(array){
    return [...array].sort(() => Math.random() - 0.5);
}

function newGame(){

    document.getElementById("message").innerHTML = "";

    let selected = shuffle(prompts).slice(0,24);

    boardData = [];

    selected.splice(12,0,"FREE SPACE");

    const board = document.getElementById("board");
    board.innerHTML = "";

    selected.forEach((item,index)=>{

        const cell = document.createElement("div");
        cell.className = "cell";

        if(item==="FREE SPACE"){
            cell.classList.add("marked");
            cell.classList.add("free");
        }

        cell.innerHTML = item;

        cell.addEventListener("click",()=>{
            if(item==="FREE SPACE") return;

            cell.classList.toggle("marked");
            checkBingo();
        });

        board.appendChild(cell);
    });

    checkBingo();
}

function checkBingo(){

    const cells = document.querySelectorAll(".cell");

    const grid = [];

    for(let r=0;r<5;r++){
        grid[r]=[];
        for(let c=0;c<5;c++){
            const index=r*5+c;
            grid[r][c]=cells[index].classList.contains("marked");
        }
    }

    let bingo=false;

    for(let r=0;r<5;r++){
        bingo = bingo || grid[r].every(v=>v);
    }

    for(let c=0;c<5;c++){
        let win=true;
        for(let r=0;r<5;r++){
            if(!grid[r][c]) win=false;
        }
        bingo = bingo || win;
    }

    let diag1=true;
    let diag2=true;

    for(let i=0;i<5;i++){
        if(!grid[i][i]) diag1=false;
        if(!grid[i][4-i]) diag2=false;
    }

    bingo = bingo || diag1 || diag2;

    if(bingo){
        document.getElementById("message").innerHTML =
            "🎉 BINGO! 🦃";

        confetti();
    }
}

function confetti(){

    for(let i=0;i<60;i++){

        const piece=document.createElement("div");

        piece.className="confetti";

        piece.style.left=Math.random()*100+"vw";

        piece.style.background=
            ["#ff9800","#ff5722","#ffd54f","#8bc34a"][
                Math.floor(Math.random()*4)
            ];

        document.body.appendChild(piece);

        setTimeout(()=>{
            piece.remove();
        },3000);
    }
}

newGame();

</script>

</body>
</html>
